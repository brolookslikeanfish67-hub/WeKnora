<!DOCTYPE html>
<html lang="en">
<head>
    <title>WeKnora</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta name="renderer" content="webkit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="Q&A, WeChat Dialogue Open Platform, Dialogue Open Platform, Dialogue Platform, Custom AI, Human-Machine Dialogue, Intelligent Q&A, Human-Computer Interaction, Natural Language Processing, Natural Language Understanding, NLP, AI Products, Open Source AI, AI Algorithms, Voice Assistant"/>
    <meta name="description" content="WeKnora is a document understanding and semantic retrieval framework based on large language models, specifically built for document scenarios with complex structures and heterogeneous content."/>
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="120x120" type="image/png" href="./public/favicon.ico"/>
</head>
<body>
<script>
(function(){
  // 1. Theme Detection & Optimization
  let theme = localStorage.getItem('WeKnora_theme') || 'light';
  if (theme === 'system') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  
  document.documentElement.setAttribute('theme-mode', theme);
  
  // Consistent with --td-bg-color-page in theme.css to avoid background flashing (#fff to #eee)
  const bg = theme === 'dark' ? '#181818' : '#eee';
  
  // Apply background styles directly to document elements
  document.documentElement.style.background = bg;
  document.documentElement.style.minHeight = '100%';
  document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
  document.body.style.background = bg;
  document.body.style.minHeight = '100%';

  // Set up container background early to prevent layout shift once DOM loads
  window.addEventListener('DOMContentLoaded', () => {
    const appEl = document.getElementById('app');
    if (appEl) {
      appEl.style.background = bg;
      appEl.style.minHeight = '100%';
    }
  });

  // 2. Native Runtime Theme Sync
  try {
    const w = window.runtime;
    if (w) {
      if (theme === 'dark') {
        if (w.WindowSetDarkTheme) w.WindowSetDarkTheme();
        if (w.WindowSetBackgroundColour) w.WindowSetBackgroundColour(24, 24, 24, 255);
      } else {
        if (w.WindowSetLightTheme) w.WindowSetLightTheme();
        if (w.WindowSetBackgroundColour) w.WindowSetBackgroundColour(238, 238, 238, 255);
      }
    }
  } catch (_) {}
})();
</script>

<script>
(function(){
  // 3. Lite Mode Routing Persistence
  try {
    if (localStorage.getItem('weknora_lite_mode') !== 'true') return;
    
    const saved = sessionStorage.getItem('weknora_lite_last_path');
    if (!saved || !saved.startsWith('/platform/') || saved.startsWith('/platform/organizations')) return;
    
    const path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    
    const target = saved.includes('#') ? saved.split('#')[0] : saved;
    if (!target) return;
    
    const current = window.location.pathname + window.location.search;
    if (target !== current) {
      window.history.replaceState(window.history.state, '', target);
    }
  } catch (e) {}
})();
</script>

<script src="/config.js"></script>

<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>

<div id="app"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
