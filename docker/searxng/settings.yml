# ==============================================================================
# WEKNORA ENTERPRISE SEARCH AGGREGATION ENGINE (SEARXNG HARDENED RUNTIME)
# Target Environment: Cloud-Native High-Throughput Kubernetes Cluster
# ==============================================================================

use_default_settings: true

general:
  instance_name: "WeKnora Core SearXNG Services"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

server:
  # Cryptographic token initialization boundary.
  # Security Enforcement: Production overrides MUST leverage SEARXNG_SECRET injected via Env/K8s Secrets.
  secret_key: "ultrasecretkey"
  base_url: false
  image_proxy: true
  
  # Upgraded to HTTP/1.1 to enable continuous TCP connection reuse and keep-alives.
  http_protocol_version: "1.1"
  method: "GET"
  
  # Infrastructure Control: Intranet internal communication bypasses local rate-limiting controls.
  # CRITICAL: If routing changes expose this ingress publicly, enforce a dedicated API gateway/WAF tier.
  limiter: false
  public_instance: false

ui:
  static_use_hash: true
  default_locale: "en" # Hardened initialization targeting global standard fallback localization.
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default

search:
  # Safe search handling profile boundary.
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  
  # Dynamic Failover Management: Circuit breaker dynamics to drop failing network instances instantly.
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

outgoing:
  # Timing Threshold Constraints: Minimized window thresholds to aggressively flush lagging upstream pipes.
  request_timeout: 4.0      # Optimized down from 6.0 to lower overall latency tails.
  max_request_timeout: 8.0  # Reduced to prevent socket hung-state loops.
  
  # High-Concurrency Network Pools: Optimized for heavy microservice request parallelization.
  pool_connections: 500     # Scaled from 100 for heavy asynchronous internal scrapers.
  pool_maxsize: 100         # Scaled from 20 to support massive load spikes under proxy pools.
  enable_http2: true
  
  # Strict Privacy & Zero-Leakage Data Policies.
  # Blocks downstream referrer data leakage back out to public search index providers.
  referrer_policy: "no-referrer"
